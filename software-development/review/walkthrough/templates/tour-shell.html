<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- TITLE:START --><title>Walkthrough</title><!-- TITLE:END -->
<!-- STYLE:START -->
<style>
:root{
  color-scheme:light dark;
  --ink:#1F2124;--ink-2:#5E6672;--ink-3:#8B94A1;--paper:#F6F7F8;--surface:#FFFFFF;
  --line:#E0E3E8;--line-2:#EFF1F4;--accent:#1B5FA8;--accent-deep:#154A83;--wash:rgba(27,95,168,0.08);
  --add-bg:#E9F6EC;--add-ink:#1E6B34;--del-bg:#FBEBEA;--del-ink:#96201B;
  --amber:#8A5A00;--amber-bg:#FFF4DB;--green:#1E6B34;--green-bg:#E9F6EC;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7E9EC;--ink-2:#A6AEBB;--ink-3:#79828F;--paper:#15171A;--surface:#1D2024;
    --line:#2E333A;--line-2:#262A30;--accent:#6FA8DC;--accent-deep:#9CC4E8;--wash:rgba(111,168,220,0.12);
    --add-bg:#16301F;--add-ink:#7FD39B;--del-bg:#3A1D1C;--del-ink:#F0918A;
    --amber:#E0B25C;--amber-bg:#33270F;--green:#7FD39B;--green-bg:#16301F;
  }
}
:root[data-theme="dark"]{
  --ink:#E7E9EC;--ink-2:#A6AEBB;--ink-3:#79828F;--paper:#15171A;--surface:#1D2024;
  --line:#2E333A;--line-2:#262A30;--accent:#6FA8DC;--accent-deep:#9CC4E8;--wash:rgba(111,168,220,0.12);
  --add-bg:#16301F;--add-ink:#7FD39B;--del-bg:#3A1D1C;--del-ink:#F0918A;
  --amber:#E0B25C;--amber-bg:#33270F;--green:#7FD39B;--green-bg:#16301F;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
section,.chapter,.file{scroll-margin-top:64px}
a{color:var(--accent-deep);text-decoration:none;border-bottom:1px solid var(--line)}
a:hover{border-bottom-color:var(--accent)}
code,pre,.mono{font-family:var(--mono);font-size:0.88em}
code{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 4px}
button{font:inherit;color:inherit}
h1,h2,h3,h4{letter-spacing:-.01em}
p{max-width:78ch}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px 80px;overflow-wrap:anywhere}
header.top{padding:36px 0 18px;border-bottom:1px solid var(--line)}
header.top .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
header.top h1{font-size:29px;line-height:1.15;font-weight:600;margin:0 0 12px}
.banner{display:flex;gap:12px;align-items:flex-start;margin:14px 0 0;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);border-radius:4px;font-size:13.5px}
.banner b{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;padding-top:3px}
.banner span{max-width:72ch}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.controls .prog{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-right:auto}
.controls .bar{height:4px;background:var(--line-2);border-radius:2px;flex-basis:100%;overflow:hidden}
.controls .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.btn{font-size:13px;padding:4px 10px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);border-radius:4px;cursor:pointer}
.btn:hover{color:var(--ink);border-color:var(--ink-3)}
.btn.primary{border-color:var(--accent);color:var(--accent-deep)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-deep);background:var(--wash)}
nav.toc{display:flex;flex-wrap:wrap;gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
nav.toc a{border:0;color:var(--ink-2);padding:2px 0}
nav.toc a:hover{color:var(--ink)}
section{padding:34px 0 8px;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
h2{font-size:21px;font-weight:600;margin:0 0 6px}
h3{font-size:16px;font-weight:600;margin:24px 0 8px}
.lede{color:var(--ink-2);margin:0 0 16px;max-width:78ch}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:18px 0 8px}
.stat{background:var(--surface);padding:12px 14px}
.stat .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-size:21px;font-weight:600;margin-top:4px}
.stat .s{font-size:12px;color:var(--ink-2);margin-top:2px}
ul.plain{padding-left:18px;max-width:78ch}
ul.plain li{margin:0 0 8px}
ol.focus{padding-left:0;list-style:none;margin:14px 0 8px;display:grid;gap:10px;counter-reset:fc}
ol.focus li{counter-increment:fc;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 13px;font-size:14px;max-width:none}
ol.focus li::before{content:counter(fc);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent-deep);border:1px solid var(--accent);border-radius:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--wash)}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap;vertical-align:middle}
.chip.risk-attention{border-color:var(--accent);color:var(--accent-deep);background:var(--wash)}
.chip.risk-medium{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.chip.risk-safe{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.chapter{margin:0 0 32px;padding-top:6px}
.chapter-head{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;margin:0 0 10px}
.chapter-head .num{font-family:var(--mono);font-size:13px;font-weight:600;border:1px solid var(--ink-3);border-radius:4px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.chapter-head h3{margin:2px 0 4px;font-size:18px}
.chapter-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12.5px}
.chapter-meta .progress{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.chapter .overview{margin:0 0 14px 46px;max-width:78ch}
.chapter .overview p{margin:0 0 8px}
.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;margin:0 0 10px 46px;padding:10px 13px 12px}
.file.is-read{border-color:var(--line-2)}
.file.is-read .file-head .path{color:var(--ink-3)}
.file-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px}
.file-head .read-box{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.file-head .read-box input{margin:0;accent-color:var(--accent)}
.file-head .status{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink-2)}
.file-head .status.st-A{color:var(--add-ink);border-color:var(--add-ink)}
.file-head .status.st-D{color:var(--del-ink);border-color:var(--del-ink)}
.file-head .path{border:0;background:transparent;padding:0;font-size:13px;color:var(--ink);word-break:break-all}
.file-head .stats{font-family:var(--mono);font-size:11.5px}
.file-head .plus{color:var(--add-ink)}
.file-head .minus{color:var(--del-ink)}
.file-head .ext{font-size:12px;color:var(--ink-2)}
.file-head .nohunk{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.why{margin:8px 0 0;font-size:13.5px;color:var(--ink-2);max-width:78ch}
.entities{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px 6px}
.entities li{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line-2);background:var(--paper);border-radius:4px;padding:1px 7px;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entities li.more{border-style:dashed}
details.hunks{margin:10px 0 0;border:0;padding:0}
details.hunks > summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:8px;padding:4px 0}
details.hunks > summary::-webkit-details-marker{display:none}
details.hunks > summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s}
details.hunks[open] > summary::before{transform:rotate(45deg)}
.hunk{margin:8px 0 12px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}
.hunk figcaption{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:6px 10px;background:var(--paper);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.hunk figcaption .loc{color:var(--ink);word-break:break-all}
.hunk figcaption .copy{margin-left:auto;font-size:11.5px;padding:1px 8px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;color:var(--ink-2);font-family:var(--mono)}
.hunk figcaption .copy:hover{color:var(--ink);border-color:var(--ink-3)}
.hunk pre.code{margin:0;padding:6px 0;font-size:12.5px;line-height:1.45;white-space:normal;overflow-x:auto;background:transparent;tab-size:2;-moz-tab-size:2}
.hunk pre.code > code{display:block;border:0;padding:0;background:transparent;border-radius:0}
.hunk .row{display:flex;min-width:100%;width:max-content}
.hunk .row .ln{width:50px;flex:0 0 50px;text-align:right;padding-right:10px;color:var(--ink-3);user-select:none}
.hunk .row .sg{width:16px;flex:0 0 16px;text-align:center;user-select:none;color:var(--ink-3)}
.hunk .row .tx{padding-right:16px;white-space:pre}
.hunk .row.add{background:var(--add-bg)}
.hunk .row.add .sg{color:var(--add-ink)}
.hunk .row.del{background:var(--del-bg)}
.hunk .row.del .sg{color:var(--del-ink)}
.hunk .row.ctx{color:var(--ink-2)}
.hunk > .why{margin:0;padding:8px 12px;border-top:1px solid var(--line-2);font-size:13px;max-width:none}
.changed-only .hunk .row.ctx{display:none}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface);margin:12px 0 18px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500;background:var(--paper)}
tr:last-child td{border-bottom:0}
td code{word-break:break-all}
.chip.exit-ok{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.chip.exit-bad{border-color:var(--del-ink);color:var(--del-ink);background:var(--del-bg)}
.chip.exit-none{border-style:dashed}
.notes .note{margin:0 0 14px}
.notes .note label{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-2);margin:0 0 4px}
.notes textarea{width:100%;min-height:72px;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);resize:vertical}
.notes .global textarea{min-height:110px}
.notes pre{max-height:280px;overflow:auto;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;white-space:pre-wrap}
.count{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin:4px 0 0}
footer{padding-top:20px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--line)}
.sr{position:absolute;left:-9999px}
@media (max-width:760px){
  .wrap{padding:0 16px 56px}
  header.top h1{font-size:23px}
  .chapter .overview,.file{margin-left:0}
  .chapter-head{grid-template-columns:28px 1fr}
  .chapter-head .num{width:26px;height:26px;font-size:12px}
}
</style>
<!-- STYLE:END -->
</head>
<body>
<!-- BODY:START -->
<!-- BODY:END -->
<!-- SCRIPT:START -->
<script>
(function () {
  "use strict";
  var wrap = document.querySelector("[data-storage-key]");
  if (!wrap) return;
  var KEY = wrap.getAttribute("data-storage-key");
  var HEAD = wrap.getAttribute("data-head-label") || "";
  var DOC_TITLE = wrap.getAttribute("data-doc-title") || "Walkthrough";

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var s = raw ? JSON.parse(raw) : {};
      return { read: s.read || {}, notes: s.notes || {}, changedOnly: !!s.changedOnly };
    } catch (e) { return { read: {}, notes: {}, changedOnly: false }; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage blocked: the page still reads */ }
  }
  var state = load();

  var cards = $$(".file[data-card]");
  var chapters = $$("article.chapter");
  function cardId(el) { return el.getAttribute("data-card"); }
  function isRead(el) { return !!state.read[cardId(el)]; }

  function applyRead() {
    cards.forEach(function (c) {
      var on = isRead(c);
      c.classList.toggle("is-read", on);
      var box = $("input.read", c);
      if (box) box.checked = on;
    });
    var done = cards.filter(isRead).length;
    var prog = $("[data-progress]");
    if (prog) prog.textContent = done + " of " + cards.length + " file cards read";
    var bar = $("[data-bar]");
    if (bar) bar.style.width = (cards.length ? Math.round(done * 100 / cards.length) : 0) + "%";
    chapters.forEach(function (ch) {
      var cs = $$(".file[data-card]", ch);
      var p = $("[data-chapter-progress]", ch);
      if (p) p.textContent = cs.length ? cs.filter(isRead).length + " of " + cs.length + " read" : "";
    });
    var cont = $("[data-continue]");
    if (cont) cont.textContent = done === 0 ? "Start reading" : done === cards.length ? "All cards read" : "Continue reading";
  }

  cards.forEach(function (c) {
    var box = $("input.read", c);
    if (!box) return;
    box.addEventListener("change", function () {
      if (box.checked) state.read[cardId(c)] = true; else delete state.read[cardId(c)];
      save(); applyRead();
    });
  });

  var cont = $("[data-continue]");
  if (cont) cont.addEventListener("click", function () {
    var next = cards.filter(function (c) { return !isRead(c); })[0];
    if (next) next.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  var reset = $("[data-reset]");
  if (reset) reset.addEventListener("click", function () { state.read = {}; save(); applyRead(); });

  var co = $("[data-changed-only]");
  function applyChangedOnly() {
    wrap.classList.toggle("changed-only", state.changedOnly);
    if (co) co.setAttribute("aria-pressed", state.changedOnly ? "true" : "false");
  }
  if (co) co.addEventListener("click", function () { state.changedOnly = !state.changedOnly; save(); applyChangedOnly(); });

  function copyText(text, done) {
    function ok() { if (done) done(true); }
    function no() { if (done) done(false); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.className = "sr";
      document.body.appendChild(ta); ta.select();
      var copied = false;
      try { copied = document.execCommand("copy"); } catch (e) { copied = false; }
      document.body.removeChild(ta);
      if (copied) ok(); else no();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }

  $$(".hunk .copy").forEach(function (b) {
    b.addEventListener("click", function () {
      var label = b.textContent;
      copyText(b.getAttribute("data-prompt") || "", function (ok) {
        b.textContent = ok ? "Copied" : "Copy failed";
        setTimeout(function () { b.textContent = label; }, 1400);
      });
    });
  });

  $$("textarea[data-note]").forEach(function (ta) {
    var id = ta.getAttribute("data-note");
    if (state.notes[id]) ta.value = state.notes[id];
    ta.addEventListener("input", function () {
      if (ta.value.trim()) state.notes[id] = ta.value; else delete state.notes[id];
      save();
    });
  });

  function feedbackMarkdown() {
    var out = ["# Walkthrough feedback: " + DOC_TITLE, "", "Revision: " + HEAD, ""];
    var general = (state.notes["general"] || "").trim();
    if (general) out.push("## General", "", general, "");
    chapters.forEach(function (ch) {
      var id = ch.getAttribute("data-chapter");
      var note = (state.notes[id] || "").trim();
      if (!note) return;
      var title = $("h3", ch);
      out.push("## " + (title ? title.textContent : id) + " (#ch-" + id + ")", "");
      var paths = $$(".file[data-file]", ch).map(function (c) { return c.getAttribute("data-file"); });
      if (paths.length) out.push("Files: " + paths.join(", "), "");
      out.push(note, "");
    });
    if (out.length === 4) out.push("(no notes written)", "");
    out.push("Read: " + cards.filter(isRead).length + " of " + cards.length + " file cards.");
    return out.join("\n");
  }

  var ex = $("[data-export]"), exs = $("[data-export-status]"), exp = $("[data-export-preview]");
  if (ex) ex.addEventListener("click", function () {
    var md = feedbackMarkdown();
    if (exp) { exp.textContent = md; exp.hidden = false; }
    copyText(md, function (ok) {
      if (exs) exs.textContent = ok ? "Copied to the clipboard. Preview below." : "Clipboard blocked. Copy from the preview below.";
    });
  });

  applyRead();
  applyChangedOnly();
})();
</script>
<!-- SCRIPT:END -->
</body>
</html>
