<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- TITLE:START --><title>Walkthrough</title><!-- TITLE:END -->
<!-- STYLE:START -->
<style>
<!-- LIB:STYLE -->
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0;padding:10px 12px;border:1px solid var(--line);background:var(--surface)}
.controls .prog{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-right:auto}
.controls .bar{height:4px;background:var(--line-2);flex-basis:100%;overflow:hidden}
.controls .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.btn{font:12px var(--mono);border:1px solid var(--ink);background:var(--surface);color:var(--ink);padding:6px 12px;min-height:32px;cursor:pointer}
.btn:hover{background:var(--paper)}
.btn.primary{border-color:var(--accent);color:var(--accent-deep)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-deep);background:var(--wash)}
section{padding:34px 0 8px;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
h2{font-size:20px;font-weight:600;margin:0 0 6px}
section>h2{margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
h3{font-size:16px;font-weight:600;margin:24px 0 8px}
.lede{color:var(--ink-2);margin:0 0 16px;max-width:78ch}
.pr-lens-views{display:grid;gap:18px;margin:18px 0 8px}
.pr-lens-view{margin:0;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.pr-lens-view figcaption{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line);background:var(--paper)}
.pr-lens-view figcaption h3{margin:0;font-size:15px}
.pr-lens-view picture{display:block;padding:12px;overflow-x:auto;text-align:center}
.pr-lens-view img{display:block;width:100%;height:auto;max-width:none;margin:auto}
ul.plain{padding-left:18px;max-width:78ch}
ul.plain li{margin:0 0 8px}
ol.focus{padding-left:0;list-style:none;margin:14px 0 8px;display:grid;gap:10px;counter-reset:fc}
ol.focus li{counter-increment:fc;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);padding:11px 13px;font-size:14px;max-width:none}
ol.focus li::before{content:counter(fc);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent-deep);border:1px solid var(--accent);width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--wash)}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap;vertical-align:middle}
.chip.risk-attention{border-color:var(--accent);color:var(--accent-deep);background:var(--wash)}
.chip.risk-medium{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.chip.risk-safe{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.chead .meta{font:11.5px var(--mono);color:var(--ink-2)}
.chapter .overview{margin:0 0 14px;max-width:78ch}
.chapter .overview p{margin:0 0 8px}
.file{background:var(--surface);border:1px solid var(--line);margin:0 0 10px;padding:10px 13px 12px}
.file.is-read{border-color:var(--line-2)}
.file.is-read .file-head .path{color:var(--ink-3)}
.file-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px}
.file-head .read-box{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.file-head .read-box input{margin:0;accent-color:var(--accent)}
.file-head .status{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:0 5px;color:var(--ink-2)}
.file-head .status.st-A{color:var(--add-ink);border-color:var(--add-ink)}
.file-head .status.st-D{color:var(--del-ink);border-color:var(--del-ink)}
.file-head .path{border:0;background:transparent;padding:0;font-size:13px;color:var(--ink);word-break:break-all}
.file-head .stats{font-family:var(--mono);font-size:11.5px}
.file-head .plus{color:var(--add-ink)}
.file-head .minus{color:var(--del-ink)}
.file-head .ext{font-size:12px;color:var(--ink-2)}
.file-head .nohunk{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.why{margin:8px 0 0;font-size:13.5px;color:var(--ink-2);max-width:78ch}
.entities{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px 6px}
.entities li{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line-2);background:var(--paper);padding:1px 7px;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entities li.more{border-style:dashed}
details.hunks{margin:10px 0 0;border:0;padding:0}
details.hunks > summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:8px;padding:4px 0}
details.hunks > summary::-webkit-details-marker{display:none}
details.hunks > summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s}
details.hunks[open] > summary::before{transform:rotate(45deg)}
.hunk{margin:8px 0 12px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.hunk figcaption{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:6px 10px;background:var(--paper);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.hunk figcaption .loc{color:var(--ink);word-break:break-all}
.hunk figcaption .copy{margin-left:auto;font-size:11.5px;padding:1px 8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2);font-family:var(--mono)}
.hunk figcaption .copy:hover{color:var(--ink);border-color:var(--ink-3)}
.hunk pre.code{margin:0;padding:6px 0;font-size:12.5px;line-height:1.45;white-space:normal;overflow-x:auto;background:transparent;tab-size:2;-moz-tab-size:2}
.hunk pre.code > code{display:block;border:0;padding:0;background:transparent;}
.hunk .row{display:flex;min-width:100%;width:max-content}
.hunk .row .ln{width:50px;flex:0 0 50px;text-align:right;padding-right:10px;color:var(--ink-3);user-select:none}
.hunk .row .sg{width:16px;flex:0 0 16px;text-align:center;user-select:none;color:var(--ink-3)}
.hunk .row .tx{padding-right:16px;white-space:pre}
.hunk .row.add{background:var(--add-bg)}
.hunk .row.add .sg{color:var(--add-ink)}
.hunk .row.del{background:var(--del-bg)}
.hunk .row.del .sg{color:var(--del-ink)}
.hunk .row.ctx{color:var(--ink-2)}
.tx .tk-cm{color:var(--tk-cm)}
.tx .tk-st{color:var(--tk-st)}
.tx .tk-kw{color:var(--tk-kw)}
.tx .tk-nu{color:var(--tk-nu)}
.tx .tk-fn{color:var(--tk-fn)}
.tx .tk-ty{color:var(--tk-ty)}
.tx .tk-at{color:var(--tk-at)}
.tk-cm{font-style:italic}
.tk-kw{font-weight:600}
.hunk > .why{margin:0;padding:8px 12px;border-top:1px solid var(--line-2);font-size:13px;max-width:none}
.changed-only .hunk .row.ctx{display:none}
.scroll{overflow-x:auto;border:1px solid var(--line);background:var(--surface);margin:12px 0 18px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500;background:var(--paper);white-space:nowrap}
tr:last-child td{border-bottom:0}
td code{word-break:break-all}
th.col-exit,td.col-exit{width:64px;white-space:nowrap}
th.col-tree,td.col-tree{width:88px;white-space:nowrap}
td.col-command{width:auto}
.chip.exit-ok{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.chip.exit-bad{border-color:var(--del-ink);color:var(--del-ink);background:var(--del-bg)}
.chip.exit-none{border-style:dashed}
.notes .note{margin:0 0 14px}
.notes .note label{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-2);margin:0 0 4px}
.notes textarea{width:100%;min-height:72px;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.notes .global textarea{min-height:110px}
.notes pre{max-height:280px;overflow:auto;font-size:12px;background:var(--surface);border:1px solid var(--line);padding:10px 12px;white-space:pre-wrap}
footer{padding-top:20px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--line)}
.sr{position:absolute;left:-9999px}
.digest{padding:0;margin:24px 0 0;border:1px solid var(--ink);background:var(--surface)}
.digest>h2{display:flex;align-items:stretch;min-height:34px;margin:0;padding:0;font-size:14px;border-bottom:1px solid var(--ink)}
.digest>h2 .ltr{display:grid;place-items:center;width:34px;flex:none;background:var(--ink);color:var(--surface);font:700 13px var(--mono)}
.digest>h2 .tt{display:flex;align-items:center;padding:0 10px}
.dg{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 16px}
.budget{margin:0;font-size:17px;line-height:1.45}
.tierbar{display:flex;height:30px;border:1px solid var(--ink);font:600 11px var(--mono)}
.tierbar span{display:flex;align-items:center;justify-content:center;min-width:28px;overflow:hidden;white-space:nowrap;border-right:1px solid var(--ink)}
.tierbar span:last-child{border-right:0}
.t-flagged{color:var(--del-ink);background:var(--del-bg)}
.t-read{color:var(--amber);background:var(--amber-bg)}
.t-skim{color:var(--accent);background:var(--wash)}
.t-matched{color:var(--green);background:var(--green-bg)}
.t-word{color:var(--ink-2);background:repeating-linear-gradient(45deg,var(--surface) 0 3px,var(--line) 3px 6px)}
.fm{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px 18px}
.fmg{min-width:0}
.fml{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;font:11px var(--mono);color:var(--ink-2)}
.fmq{display:flex;flex-wrap:wrap;gap:2px}
.sq{display:block;width:10px;height:10px;padding:0;border:1px solid var(--line)}
.fm.small .sq{width:8px;height:8px}
.sq.t-flagged{background:var(--del-ink);border-color:var(--del-ink)}
.sq.t-read{background:var(--amber);border-color:var(--amber)}
.sq.t-skim{background:var(--accent);border-color:var(--accent)}
.sq.t-matched{border-color:var(--green)}
.sq.t-word{border-color:var(--ink-2)}
a.sq:hover,a.sq:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.dg-key{display:flex;flex-wrap:wrap;gap:4px 14px;font:11px var(--mono);color:var(--ink-2)}
.dg-key .sq{display:inline-block;margin-right:5px;vertical-align:-1px}
.cover{margin:0;padding-top:10px;border-top:1px solid var(--line);font:12px var(--mono);color:var(--ink-2);max-width:none}
.cover b{color:var(--ink)}
.sect{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:26px 0 8px;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.sect b{color:var(--ink)}
.tier{flex:none;padding:2px 6px;border:1px solid;font:700 10px var(--mono);letter-spacing:.06em;white-space:nowrap}
.tier.t-word{background:var(--paper)}
.chead .kind{flex:none;font:11px var(--mono);color:var(--ink-2)}
.chead .ttl.path{min-width:0;font:600 14px var(--mono);overflow-wrap:anywhere}
.chapter.flag{border:2px solid var(--del-ink)}
.chapter.flag .num{background:var(--del-ink)}
.hunk .row.rl{font:11px var(--mono);color:var(--ink-2);background:var(--paper)}
.proof{margin:0 0 10px;padding:8px 10px;border:1px solid var(--green);background:var(--green-bg);font-size:13.5px;max-width:none}
.proof.broke{border-color:var(--del-ink);background:var(--del-bg)}
.wordnote{margin:8px 0;padding:8px 10px;border:1px solid var(--line);background:var(--paper);font-size:13.5px;max-width:none}
.method{margin:8px 0;font-size:13px;color:var(--ink-2)}
.chapter.group .why{margin:0 0 10px}
ul.whys{margin:0 0 10px;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
ul.flist{list-style:none;margin:8px 0 0;padding:0;font:12px var(--mono);columns:2 260px;column-gap:24px}
ul.flist li{padding:2px 0;break-inside:avoid}
ul.flist .fst{display:inline-block;width:16px;color:var(--ink-2)}
ul.flist code,ul.whys code{border:0;background:none;padding:0}
ul.flist .plus{color:var(--add-ink)}
ul.flist .minus{color:var(--del-ink)}
details.all{margin:10px 0 0}
details.all>summary{cursor:pointer;padding:4px 0;font:11.5px var(--mono);color:var(--ink-2)}
@media (max-width:760px){
  .wrap{padding:0 16px 96px}
  header.top h1{font-size:23px}
  .budget{font-size:15px}
  .dg{padding:12px}
  .chead{flex-wrap:wrap;row-gap:4px}
  .chead .meta{order:5;flex-basis:100%;padding-left:46px}
}
<!-- SHEET:STYLE -->
</style>
<!-- STYLE:END -->
</head>
<body>
<!-- BODY:START -->
<!-- BODY:END -->
<!-- SCRIPT:START -->
<script>
(function () {
  "use strict";
  var wrap = document.querySelector("[data-storage-key]");
  if (!wrap) return;
  var KEY = wrap.getAttribute("data-storage-key");
  var HEAD = wrap.getAttribute("data-head-label") || "";
  var DOC_TITLE = wrap.getAttribute("data-doc-title") || "Walkthrough";

<!-- LIB:SCRIPT -->

  var cards = $$(".file[data-card]");
  var tourChapters = $$("details.chapter[data-chapter]");
  function cardId(el) { return el.getAttribute("data-card"); }
  function isRead(el) { return !!state.read[cardId(el)]; }

  function applyRead() {
    cards.forEach(function (c) {
      var on = isRead(c);
      c.classList.toggle("is-read", on);
      var box = $("input.read", c);
      if (box) box.checked = on;
    });
    var done = cards.filter(isRead).length;
    var prog = $("[data-progress]");
    if (prog) prog.textContent = done + " of " + cards.length + " cards read";
    var bar = $("[data-bar]");
    if (bar) bar.style.width = (cards.length ? Math.round(done * 100 / cards.length) : 0) + "%";
    tourChapters.forEach(function (ch) {
      var cs = $$(".file[data-card]", ch);
      var p = $("[data-chapter-progress]", ch);
      if (p) p.textContent = cs.length ? cs.filter(isRead).length + " of " + cs.length + " read" : "";
    });
    var cont = $("[data-continue]");
    if (cont) cont.textContent = done === 0 ? "Start reading" : done === cards.length ? "All cards read" : "Continue reading";
  }

  cards.forEach(function (c) {
    var box = $("input.read", c);
    if (!box) return;
    box.addEventListener("change", function () {
      if (box.checked) state.read[cardId(c)] = true; else delete state.read[cardId(c)];
      save(); applyRead();
    });
  });

  var cont = $("[data-continue]");
  if (cont) cont.addEventListener("click", function () {
    var next = cards.filter(function (c) { return !isRead(c); })[0];
    if (!next) return;
    for (var d = next.closest("details"); d; d = d.parentElement && d.parentElement.closest("details")) d.open = true;
    next.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  var reset = $("[data-reset]");
  if (reset) reset.addEventListener("click", function () { state.read = {}; save(); applyRead(); });

  var co = $("[data-changed-only]");
  function applyChangedOnly() {
    wrap.classList.toggle("changed-only", state.changedOnly);
    if (co) co.setAttribute("aria-pressed", state.changedOnly ? "true" : "false");
  }
  if (co) co.addEventListener("click", function () { state.changedOnly = !state.changedOnly; save(); applyChangedOnly(); });

  function copyText(text, done) {
    function ok() { if (done) done(true); }
    function no() { if (done) done(false); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.className = "sr";
      document.body.appendChild(ta); ta.select();
      var copied = false;
      try { copied = document.execCommand("copy"); } catch (e) { copied = false; }
      document.body.removeChild(ta);
      if (copied) ok(); else no();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }

  $$(".hunk .copy").forEach(function (b) {
    b.addEventListener("click", function () {
      var label = b.textContent;
      copyText(b.getAttribute("data-prompt") || "", function (ok) {
        b.textContent = ok ? "Copied" : "Copy failed";
        setTimeout(function () { b.textContent = label; }, 1400);
      });
    });
  });

  $$("textarea[data-note]").forEach(function (ta) {
    var id = ta.getAttribute("data-note");
    if (state.notes[id]) ta.value = state.notes[id];
    ta.addEventListener("input", function () {
      if (ta.value.trim()) state.notes[id] = ta.value; else delete state.notes[id];
      save();
    });
  });

  function feedbackMarkdown() {
    var out = ["# Walkthrough feedback: " + DOC_TITLE, "", "Revision: " + HEAD, ""];
    var general = (state.notes["general"] || "").trim();
    if (general) out.push("## General", "", general, "");
    tourChapters.forEach(function (ch) {
      var id = ch.getAttribute("data-chapter");
      var note = (state.notes[id] || "").trim();
      if (!note) return;
      var title = $("h3", ch);
      out.push("## " + (title ? title.textContent : id) + " (#ch-" + id + ")", "");
      var paths = $$(".file[data-file]", ch).map(function (c) { return c.getAttribute("data-file"); });
      if (paths.length) out.push("Files: " + paths.join(", "), "");
      out.push(note, "");
    });
    if (out.length === 4) out.push("(no notes written)", "");
    var flagged = $$("details.flag[data-flag]").map(function (d) { return d.getAttribute("data-flag"); });
    if (flagged.length) out.push("Flagged by the build: " + flagged.join(", "), "");
    out.push("Read: " + cards.filter(isRead).length + " of " + cards.length + " file cards.");
    return out.join("\n");
  }

  // The shared dock sends this. sheetParts exists only when the tour has a sheet.
  dockCollect = function () {
    var parts = typeof sheetParts === "function" ? sheetParts() : { answers: [], notes: {}, fix: [], skip: [] };
    var notes = {};
    Object.keys(state.notes).forEach(function (id) {
      if ((state.notes[id] || "").trim()) notes[id] = state.notes[id].trim();
    });
    Object.keys(parts.notes).forEach(function (id) { notes[id] = parts.notes[id]; });
    return { title: DOC_TITLE, text: feedbackMarkdown(), answers: parts.answers, notes: notes, fix: parts.fix, skip: parts.skip };
  };

<!-- SHEET:SCRIPT -->
  applyRead();
  applyChangedOnly();
})();
</script>
<!-- SCRIPT:END -->
</body>
</html>
