<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- STYLE:START -->
<style>
<!-- LIB:STYLE -->
<!-- SHEET:STYLE -->
.report{margin:28px 0 20px;scroll-margin-top:16px}
.rhead{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.rhead h2{font-size:20px;margin:0}
.report .btn{font:12px var(--mono);border:1px solid var(--ink);background:var(--surface);color:var(--ink);padding:6px 12px;min-height:32px;cursor:pointer}
.chapter{margin:0 0 12px;background:var(--surface);border:1px solid var(--line);scroll-margin-top:16px}
.chead{display:flex;gap:12px;align-items:center;min-height:44px;padding:6px 12px;cursor:pointer;list-style:none}
.chead::-webkit-details-marker{display:none}
.chead:hover{background:var(--paper)}
.chead .ttl{flex:1;margin:0;font-size:16px;font-weight:600}
.chapter .num{font:600 14px var(--mono);background:var(--ink);color:var(--surface);width:34px;height:28px;flex:none;display:grid;place-items:center}
.chead .back{font:11px var(--mono);color:var(--blu);text-decoration:none;white-space:nowrap}
.chead .back:hover{text-decoration:underline}
.chev{flex:none;color:var(--ink-2);transition:transform .15s}
.chapter[open]>.chead .chev{transform:rotate(90deg)}
.chapter[open]>.chead{border-bottom:1px solid var(--line)}
.dbody{padding:8px 14px 14px}
.figs{display:grid;grid-template-columns:1fr;gap:14px;margin:12px 0}
.figs.row{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cfig{margin:0;border:1px solid var(--line);background:var(--surface)}
.cfig .fig{padding:0}
.cfig pre.mermaid{margin:0;padding:14px;white-space:pre-wrap;word-break:break-word}
.cfig figcaption{padding:8px 14px;border-top:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--ink-2)}
picture img{display:block;max-width:100%;height:auto}
.chapter .prose p{margin:0 0 10px}
.chapter .prose h4{font-size:14px;margin:16px 0 6px}
.chapter .scroll{overflow-x:auto;border:1px solid var(--line);margin:10px 0 14px}
.chapter table{border-collapse:collapse;width:100%;font-size:13.5px}
.chapter .scroll table{min-width:520px}
.chapter .prose table{margin:10px 0 14px;border:1px solid var(--line)}
.chapter th,.chapter td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line)}
.chapter th{font:11px var(--mono);color:var(--ink-2);font-weight:500;background:var(--paper);white-space:nowrap}
.chapter tr:last-child td{border-bottom:0}
.chapter td code{word-break:break-all}
.chapter .col-exit{width:64px;white-space:nowrap}
.chapter .col-cwd{min-width:160px;white-space:nowrap}
.chapter .chip{display:inline-block;font:11px var(--mono);padding:1px 7px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chapter .chip.exit-ok{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.chapter .chip.exit-bad{border-color:var(--del-ink);color:var(--del-ink);background:var(--del-bg)}
.chapter .chip.exit-none{border-style:dashed}
.dnote textarea{width:100%;min-height:64px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.pgfoot{padding-top:16px;font:11.5px var(--mono);color:var(--ink-2)}
@media (max-width:760px){.wrap{padding:0 12px 56px}}
</style>
<!-- STYLE:END -->
</head>

</html>
