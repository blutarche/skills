<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- TITLE:START --><title>Brief</title><!-- TITLE:END -->
<!-- STYLE:START -->
<style>
<!-- LIB:STYLE -->
<!-- SHEET:STYLE -->
.drawers{margin:20px 0}
.drawer{border:1px solid var(--line);background:var(--surface);margin:0 0 8px;scroll-margin-top:64px}
.drawer>summary{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;list-style:none;font-weight:600}
.drawer>summary::-webkit-details-marker{display:none}
.drawer>summary::before{content:"+";font-family:var(--mono);color:var(--ink-2);width:12px}
.drawer[open]>summary::before{content:"\2212"}
.drawer .num{font-family:var(--mono);font-size:12px;border:1px solid var(--ink-3);width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.dbody{padding:4px 16px 16px;border-top:1px solid var(--line)}
.figs{display:grid;grid-template-columns:1fr;gap:14px;margin:12px 0}
.figs.row{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cfig{margin:0;border:1px solid var(--line);background:var(--surface)}
.cfig .fig{padding:0}
.cfig pre.mermaid{margin:0;padding:14px;white-space:pre-wrap;word-break:break-word}
.cfig figcaption{padding:8px 14px;border-top:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--ink-2)}
picture img{display:block;max-width:100%;height:auto}
.drawer .prose p{margin:0 0 10px}
.drawer .scroll{overflow-x:auto;border:1px solid var(--line);margin:10px 0 14px}
.drawer table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
.drawer th,.drawer td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line)}
.drawer th{font:11px var(--mono);color:var(--ink-2);font-weight:500;background:var(--paper);white-space:nowrap}
.drawer tr:last-child td{border-bottom:0}
.drawer td code{word-break:break-all}
.drawer .col-exit{width:64px;white-space:nowrap}
.drawer .col-cwd{min-width:160px;white-space:nowrap}
.drawer .chip{display:inline-block;font:11px var(--mono);padding:1px 7px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.drawer .chip.exit-ok{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.drawer .chip.exit-bad{border-color:var(--del-ink);color:var(--del-ink);background:var(--del-bg)}
.drawer .chip.exit-none{border-style:dashed}
.dnote textarea{width:100%;min-height:64px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.fb{margin:20px 0 8px}
.fb .lede{color:var(--ink-2);margin:0 0 10px}
.fb .btn{font:13px var(--mono);border:1px solid var(--ink);background:var(--surface);color:var(--ink);padding:5px 12px;cursor:pointer}
.fb .count{font:12px var(--mono);color:var(--ink-2)}
.fb pre{max-height:280px;overflow:auto;font-size:12px;background:var(--surface);border:1px solid var(--line);padding:10px 12px;white-space:pre-wrap}
.pgfoot{padding-top:16px;font:11.5px var(--mono);color:var(--ink-2)}
@media (max-width:760px){.wrap{padding:0 12px 56px}}
</style>
<!-- STYLE:END -->
</head>
